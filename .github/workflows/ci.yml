name: CI

on:
  push:
    branches:
      - main

env:
  PROJECT: cloops.microservices.sdk.csproj
  BUILD_CONFIGURATION: Release
  MAJOR: 1
  MINOR: 1

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The DB.pars date/time tests assert SQL Server's own conversion and comparison behaviour, so
    # they need a real server; without one they skip and prove nothing.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
          MSSQL_PID: Developer
        ports:
          - 14333:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Calculate package version
        id: version
        run: |
          VERSION="${{ env.MAJOR }}.${{ env.MINOR }}.${{ github.run_number }}"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build project
        run: dotnet build ${{ env.PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Wait for SQL Server
        # The mssql image ships no healthcheck, so poll the port rather than let the integration
        # tests skip themselves on a server that was simply still starting.
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/14333) >/dev/null 2>&1; then
              echo "SQL Server accepting connections after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "SQL Server did not come up; date/time integration tests will skip." >&2

      - name: Run tests
        # No --no-build here: the build step above builds only $PROJECT, so the test project
        # still needs to be built.
        env:
          CLOOPS_TEST_SQL_CONNECTION_STRING: "Server=127.0.0.1,14333;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=True;Encrypt=False;Database=master"
        run: dotnet test tests/cloops.microservices.sdk.Tests/cloops.microservices.sdk.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*"
          if-no-files-found: ignore

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Calculate package version
        id: version
        run: |
          VERSION="${{ env.MAJOR }}.${{ env.MINOR }}.${{ github.run_number }}"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build project
        run: dotnet build ${{ env.PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Pack NuGet package
        run: dotnet pack ${{ env.PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./artifacts -p:Version=${{ steps.version.outputs.PACKAGE_VERSION }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/**/*.nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/**/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Tag
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.PACKAGE_VERSION }}';
            const tag = `v${version}`;

            // Check if tag already exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              console.log(`Tag ${tag} already exists, skipping creation.`);
            } catch (error) {
              if (error.status === 404) {
                // Tag doesn't exist, create it
                const sha = context.sha;
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                  sha: sha
                });
                console.log(`Created tag ${tag} at ${sha}`);
              } else {
                throw error;
              }
            }

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.PACKAGE_VERSION }}';
            const tag = `v${version}`;

            // Check if release already exists
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`Release for tag ${tag} already exists, skipping creation.`);
            } catch (error) {
              if (error.status === 404) {
                // Release doesn't exist, create it
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `Release ${tag}`,
                  body: `## Release ${tag}\n\n- Version: ${version}\n- Build Number: ${{ github.run_number }}\n- Commit: ${{ github.sha }}\n\nAutomated release created by CI pipeline.`,
                  draft: false,
                  prerelease: false
                });
                console.log(`Created release for tag ${tag}`);
              } else {
                throw error;
              }
            }

